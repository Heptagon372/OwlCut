name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # LayoutProps/PageProps 등 Next가 생성하는 타입이 필요하므로 typegen 후 tsc
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
